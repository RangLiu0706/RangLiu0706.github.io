---
layout: compress
---

<!doctype html>
<html lang="en" class="no-js">
  <head>
    {% include head.html %}
    {% include head/custom.html %}
  </head>

  <body>

    {% include browser-upgrade.html %}
    {% include masthead.html %}

    <div id="page-status" class="page-status" role="status" aria-live="polite" aria-atomic="true"></div>

    <div id="main" role="main">
      {% include sidebar.html %}
    
      <article class="page" itemscope itemtype="http://schema.org/CreativeWork">
        <div class="page__inner-wrap">      
          <section id="pjax-container" class="page__content" itemprop="text">
            {{ content }}
          </section>
        </div>
      </article>
      
      
    </div>

    <button id="back-to-top" class="back-to-top" type="button" aria-label="Back to top" hidden>
      <i class="fas fa-arrow-up" aria-hidden="true"></i><span>Top</span>
    </button>

    {% include scripts.html %}

  </body>
</html>
