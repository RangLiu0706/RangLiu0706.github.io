{% if include.link == false %}<span class="pub-badge pub-code">{% else %}<a href="https://github.com/{{ include.repo | escape }}" class="pub-badge pub-code" target="_blank" rel="noopener noreferrer" aria-label="View {{ include.repo | split: '/' | last | escape }} code on GitHub">{% endif %}<i class="fab fa-github" aria-hidden="true"></i><span>Code</span>{% unless include.stars == false %}<span class="pub-code-stars"><span aria-hidden="true">· ★</span><img src="https://img.shields.io/github/stars/{{ include.repo | escape }}?style=flat-square&amp;label=&amp;color=rgba%28255%2C255%2C255%2C0%29" alt="GitHub stars"></span>{% endunless %}{% if include.link == false %}</span>{% else %}</a>{% endif %}
